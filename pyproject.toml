[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-cloud"
version = "0.3.0"
description = "Small Cloud creator CLI and workspace identity service"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]==2.12.1", "keyring==25.7.0", "certifi==2026.7.22"]

[project.scripts]
small-cloud = "identity.cli:main"
small-cloud-identity = "identity.server:main"

[tool.setuptools.packages.find]
include = ["identity"]
